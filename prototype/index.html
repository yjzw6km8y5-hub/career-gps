<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career GPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-style="b" data-accent="orange" data-role="home">
  <div class="sky" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="Career GPS home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="currentColor" opacity=".18"/><path d="M16 5c-5 0-8.5 3.6-8.5 8.3C7.5 19.5 16 27 16 27s8.5-7.5 8.5-13.7C24.5 8.6 21 5 16 5zm0 11.6a3.3 3.3 0 1 1 0-6.6 3.3 3.3 0 0 1 0 6.6z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Career GPS</span>
        <span class="brand-tag">Swapna se Sankalp tak</span>
      </span>
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="mr">मराठी</button>
    </div>
  </header>

  <div class="demo-banner" id="demoBanner"></div>

  <main id="app" aria-live="polite"></main>

  <aside class="style-picker" aria-label="Pick a look">
    <span class="sp-label">For the owner: accent colour</span>
    <div class="sp-buttons">
      <button type="button" data-style-pick="o"><span class="sw sw-o" aria-hidden="true"></span>B · Orange</button>
      <button type="button" data-style-pick="b"><span class="sw sw-b" aria-hidden="true"></span>B · Original</button>
    </div>
    <a class="sp-compare" href="compare.html">See both side by side</a>
  </aside>

  <script src="data/strings.js"></script>
  <script src="data/demo-family.js"></script>
  <script src="data/profile-questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
